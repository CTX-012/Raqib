name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / clippy / fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # v1.0.4 — doc-warning gate. Rustdoc flags are passed via the
      # RUSTDOCFLAGS env var; `cargo doc -- -D warnings` does NOT
      # work because the `--` separator forwards to the built
      # binary, not to rustdoc.
      - name: cargo doc (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        # cargo-audit exits non-zero on known vulnerabilities; we want the
        # pipeline to fail loudly in that case.
        run: cargo audit

  deb:
    name: build .deb
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install --locked cargo-deb
      - name: cargo deb
        run: cargo deb
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge_monitor-deb
          path: target/debian/*.deb
          if-no-files-found: error

  # Freshness gate for the committed web/dist/ bundle. `cargo build`
  # embeds web/dist/ via rust-embed at compile time; the bundle is
  # committed so end users don't need Node. This job rebuilds the
  # bundle from web/src/ against a pinned Node version and fails the
  # PR if the committed bundle drifted from a fresh build. That's the
  # discipline that keeps "committed dist" from silently going stale.
  #
  # Node version is pinned because vite's minifier output is stable
  # WITHIN a Node major but can drift ACROSS majors. Bumping this
  # version is a deliberate action (regenerate + recommit dist).
  web-dist-freshness:
    name: web/dist freshness
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm --prefix web ci
      - name: npm run build (fresh)
        run: npm --prefix web run build
      - name: verify committed dist matches fresh build
        run: |
          if ! git diff --exit-code -- web/dist/ ; then
            echo "::error::web/dist/ is out of date. Regenerate with:" >&2
            echo "::error::  npm --prefix web ci && npm --prefix web run build" >&2
            echo "::error::  git add web/dist/ && commit" >&2
            exit 1
          fi
