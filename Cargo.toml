[package]
name = "edge_monitor"
version = "0.1.0"
edition = "2024"
authors = ["Mohaaxa"]
license = "MIT OR Apache-2.0"
description = "Model-aware resource monitor and governor for edge AI workloads"
readme = "README.md"

[dependencies]
sysinfo = "0.38"
nvml-wrapper = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true