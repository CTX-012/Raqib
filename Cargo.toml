[package]
# `name` is the LIBRARY CRATE identifier — internal Rust package
# name, never surfaced to users. Kept as `edge_monitor` so the
# ~30 `use edge_monitor::…` imports across the binary + tests +
# integration crates stay stable through the raqib rename. The
# BINARY output is renamed to `raqib` via the `[[bin]]` target
# below.
name = "edge_monitor"
version = "1.3.2"
edition = "2024"
authors = ["Mohaaxa"]
license = "MIT OR Apache-2.0"
description = "raqib — model-aware resource monitor and governor for edge AI workloads"
readme = "README.md"
homepage = "https://github.com/Mohaaxa/edge_monitor"
repository = "https://github.com/Mohaaxa/edge_monitor"
keywords = ["monitoring", "governor", "ai", "jetson", "edge"]
categories = ["command-line-utilities", "os::linux-apis"]

# raqib rename — the binary target ships as `raqib`. Users type
# `raqib`, `raqib init`, `raqib history`, etc. The library crate
# stays `edge_monitor` (see `[package] name` comment above).
[[bin]]
name = "raqib"
path = "src/main.rs"

[dependencies]
sysinfo = "0.38"
nvml-wrapper = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
ctrlc = { version = "3", features = ["termination"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync", "io-util", "process", "net"] }
async-trait = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
sha2 = "0.10"

# Sprint-6 web UI — axum router on tokio, WebSocket via tokio-tungstenite-
# style upgrade, static assets embedded into the binary so the operator
# runs `edge_monitor` and gets the dashboard at http://localhost:7070
# with no extra deploy step.
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
# v1.3.2 / DISPATCH 85 — constant-time byte-slice compare for the
# web auth path. A naive `==` leaks length/content via timing; the
# `subtle::ConstantTimeEq` trait provides a `ct_eq` method whose
# branches consume the same number of CPU cycles regardless of the
# secret. Tiny crate, no_std-friendly, the canonical Rust choice
# for this primitive.
subtle = "2"

# UX_CONTRACT.md v0.3 source of truth — copy strings, alert IDs, thresholds,
# action enum, themes, sizing. VENDORED as a workspace member at
# ./ux_contract/ so a fresh clone of this repo builds standalone. The
# copy is byte-verbatim from the upstream contract crate; do not edit
# from within this repo — file a Contract Amendment Request instead
# (see docs/state/PENDING.md), have the change land upstream, then
# re-vendor.
ux_contract = { path = "ux_contract", version = "0.3.14" }

# v1.1.7 (DISPATCH 22 ITEM 3 fallback, operator-pre-approved) — mimalloc
# global allocator. The Arc-share fix (ITEM 1) dropped per-tick clone
# pressure by ~85%, but the 5-min RSS endurance run still showed
# ~220 MB/min growth from glibc allocator fragmentation under high
# short-lived-allocation churn (sysinfo /proc scans, JSON serialization,
# stdlib subprocess pipes). mimalloc tracks free lists more aggressively
# and returns memory to the OS on a faster cadence — closes the residual
# gap without a sampler-by-sampler audit of who allocates what.
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
# Sprint-6 — web e2e tests need an HTTP / WebSocket client. `reqwest`
# is already a runtime dep but used here for tests too; `tokio-
# tungstenite` is dev-only.
tokio-tungstenite = "0.24"

# Workspace root. `ux_contract` is a vendored member (see the
# path-dep note above); the root crate `edge_monitor` is implicitly
# a member as well. Keeping the wire contract inside the workspace
# is what makes `git clone && cargo build` work standalone — the
# previous `path = "../ux_contract"` sibling-repo setup only
# resolved on the maintainer's laptop.
[workspace]
members = ["ux_contract"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# cargo-deb metadata. `cargo deb` picks this up and produces
# target/debian/edge_monitor_<version>_<arch>.deb.
[package.metadata.deb]
maintainer = "Mohaaxa"
copyright = "2026, Mohaaxa"
license-file = ["LICENSE-MIT", "4"]
extended-description = """\
edge_monitor is a model-aware resource monitor and governor for edge AI
workloads on Linux. It sees which model each Python process is running
and kills the offender before the kernel OOM-killer takes the whole
robot stack down. Ships with an allowlist-first policy, the
CAR-17 kill_confirm card as the only manual-kill path, and a
3-kills-per-60s rate limit."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/edge_monitor", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/edge_monitor/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/edge_monitor/CHANGELOG.md", "644"],
    ["LICENSE-MIT", "usr/share/doc/edge_monitor/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/edge_monitor/LICENSE-APACHE", "644"],
    ["edge_monitor.toml.example", "usr/share/doc/edge_monitor/edge_monitor.toml.example", "644"],
]